# Retroalimenta en el VPS: la app (Next.js) detrás de Caddy, que pone HTTPS solo.
# Uso: cp despliegue/env.ejemplo .env  →  edita .env  →  docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      RETROALIMENTA_CLAUDE_KEY: ${RETROALIMENTA_CLAUDE_KEY}
      APP_URL: https://${DOMINIO}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      REGISTRO_CODIGO: ${REGISTRO_CODIGO:-}
      CREDITOS_INICIALES: ${CREDITOS_INICIALES:-50}
    volumes:
      - datos:/datos
    expose:
      - "3000"

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./despliegue/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config

volumes:
  datos:
  caddy_datos:
  caddy_config:
